server:
  port: 8097

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  application:
    name: billetterieservice
  profiles:
    active: default
  main:
    allow-bean-definition-overriding: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5435/innodb
    username: inno2711
    password: manager2711
    hikari:
      connection-test-query: SELECT 1

  jpa:
    database: POSTGRESQL
    open-in-view: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: innodb

  cloud:
    discovery:
      client:
        composite-indicator:
          enabled: true

  kafka:
    bootstrap-servers:
      - localhost:9093
    template:
      default-topic: NOTIFICATION_TOPIC
    producer:
      group-id: topicgroupid
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.request.size: 1300000000
    properties:
      spring:
        json:
          type:
            mapping: Notification:io.multi.billetterieservice.event.Notification
      message.max.bytes: 1300000000
      max.request.size: 1300000000

eureka:
  instance:
    # Dev local : toujours s'inscrire comme localhost (l'IP change avec le Wi-Fi)
    hostname: localhost
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://manager:manager2711@localhost:5003/eureka/

ui:
  app:
    url: http://localhost:5173

key:
  private: private.key
  public: public.key

jwks:
  uri: http://localhost:8090/oauth2/jwks

billetterie:
  avis:
    # Délai (heures) après l'arrivée estimée avant d'envoyer la demande d'avis.
    # Surchargeable via BILLETTERIE_AVIS_DELAI_HEURES (ex: 0 en TEST pour valider tout de suite).
    delai-heures: ${BILLETTERIE_AVIS_DELAI_HEURES:24}

# Firebase Cloud Messaging — clé compte de service en base64 (secret serveur,
# jamais commité). Absent = push désactivées (notifications in-app inchangées).
fcm:
  service-account-b64: ${FCM_SERVICE_ACCOUNT_B64:}

orange:
  api:
    oauth:
      url: https://api.orange.com/oauth/v3/token
    sms:
      url: https://api.orange.com/smsmessaging/v1/outbound/tel:+224622459305/requests
      balance:
        url: https://api.orange.com/sms/admin/v1/contracts
    client:
      credentials: Basic VExqQ1BlQ1ZDdUxTRURLUjc2Z0RZcXo5QWw4a3h5M3A6bVV6Y0tsTHhRdkp1Z1lpTWN2UFdjT2lMN3ppc3RSdDFCRjVvajIxNEwxRGs=
    sender:
      address: tel:+224622459305

sms:
  code:
    length: 6
  expiry:
    minutes: 10
  max:
    attempts: 3
  rate:
    limit:
      per:
        hour: 3
  sender:
    name: SMS 335524
  primary:
    provider: orange
  fallback:
    enabled: true
  send:
    timeout:
      seconds: 30
  retry:
    attempts: 2

# Paiement en ligne. Le prestataire est choisi par le code du mode de règlement
# (cf. table modes_reglement) : ajouter Soutra Money ou Kulu demain revient à
# écrire une implémentation de PrestatairePaiement et à lister ses codes ici.
paiement:
  # Page du site où le client revient après avoir payé.
  url-retour: ${PAIEMENT_URL_RETOUR:http://localhost:5173/paiement/retour}
  # Adresse appelée par le prestataire, de serveur à serveur. Elle doit être
  # joignable depuis Internet : en développement, passer par un tunnel.
  url-notification: ${PAIEMENT_URL_NOTIFICATION:http://localhost:9000/billetterie/paiements/notification}
  # Au bout de ce délai sans paiement, la commande est abandonnée et ses places
  # rendues à la vente. Doit rester supérieur au temps qu'un client met à payer
  # chez le prestataire, sinon on annule sous ses doigts.
  delai-expiration-minutes: ${PAIEMENT_DELAI_EXPIRATION_MINUTES:30}
  # Garde-fou : passé ce délai la commande est abandonnée même si le prestataire
  # ne répond pas, pour qu'une panne chez lui ne gèle pas un départ entier.
  delai-abandon-minutes: ${PAIEMENT_DELAI_ABANDON_MINUTES:1440}
  # Cadence de la purge, et retard au démarrage pour laisser le service s'ouvrir.
  purge-intervalle-ms: ${PAIEMENT_PURGE_INTERVALLE_MS:300000}
  purge-delai-initial-ms: ${PAIEMENT_PURGE_DELAI_INITIAL_MS:60000}
  chapchap:
    # Clés hexadécimales de 64 caractères, générées dans le tableau de bord
    # Chap Chap Pay, section « Clés API ». C'est la clé elle-même qui décide du
    # mode : une clé de test n'engage aucun fonds, l'adresse de base ne change
    # pas. Vides par défaut, comme CinetPay : un environnement non configuré
    # garde les règlements hors ligne au lieu de refuser toute commande.
    api-key: ${CHAPCHAP_API_KEY:}
    # Sert à signer le corps des requêtes en HMAC-SHA256, pas à s'authentifier.
    # Nom repris du projet distcanal, pour garder une seule convention.
    encryption-password: ${CHAPCHAP_ENCRYPTION_PASSWORD:}
    base-url: ${CHAPCHAP_BASE_URL:https://chapchappay.com/api}
    # Codes de modes de règlement confiés à ce prestataire. Il couvre, en plus
    # d'Orange Money et MTN, des moyens proprement guinéens que CinetPay ignore.
    modes: ${CHAPCHAP_MODES:}
    # Champ fee_handling de l'API. Les frais sont retenus sur le montant
    # encaissé : le marchand GUIDIPRESS
    # n'est pas autorisé au mode « add », qui les ajouterait à la charge du
    # client. Encaisser 100 000 rapporte donc moins de 100 000.
    fee-handling: ${CHAPCHAP_FEE_HANDLING:deduct}
    # Bornes imposées par le prestataire pour ce marchand. Une commande hors
    # de ces bornes sera refusée par lui, autant le savoir avant d'appeler.
    min-amount: ${CHAPCHAP_MIN_AMOUNT:1000}
    max-amount: ${CHAPCHAP_MAX_AMOUNT:5000000}
  cinetpay:
    api-key: ${CINETPAY_API_KEY:}
    site-id: ${CINETPAY_SITE_ID:}
    # Bac à sable et production partagent cette adresse, les clés distinguent
    # les deux environnements.
    base-url: ${CINETPAY_BASE_URL:https://api-checkout.cinetpay.com/v2}
    modes: ${CINETPAY_MODES:OM,MOMO,CB}
