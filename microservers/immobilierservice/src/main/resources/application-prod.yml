server:
  port: 8098

spring:
  datasource:
    url: jdbc:postgresql://postgresdb:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  kafka:
    bootstrap-servers:
      - kafka:29093

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@discoveryserver:8761/eureka/

ui:
  app:
    url: ${UI_APP_URL:https://synergia-guinee.com}

jwks:
  uri: http://authorizationserver:8090/authorization/oauth2/jwks

# Stockage des photos : MinIO embarqué par défaut, OVHcloud Object Storage dès que
# MINIO_ENDPOINT / MINIO_REGION / MINIO_PUBLIC_READ sont renseignés
# (procédure : docs/bascule-object-storage-ovh.md).
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  public-base-url: ${MINIO_PUBLIC_URL}
  region: ${MINIO_REGION:us-east-1}
  path-style: ${MINIO_PATH_STYLE:true}
  public-read: ${MINIO_PUBLIC_READ:false}
  bucket-photos: ${MINIO_BUCKET_PHOTOS:immo-photos}
  bucket-thumbnails: ${MINIO_BUCKET_THUMBNAILS:immo-photos-thumbnails}

logging:
  level:
    io.multi.immobilierservice: INFO
