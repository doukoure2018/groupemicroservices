spring:
  application:
    name: discoveryserver
  datasource:
    url: jdbc:postgresql://localhost:5435/innodb
    # Identifiants jamais écrits ici : ils ouvrent aussi la base de production.
    # En local, exporter les variables du .env avant de lancer :
    #   set -a; source .env; set +a
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-test-query: SELECT 1
  profiles:
    active: default
  jpa:
    database: POSTGRESQL
    open-in-view: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQL82Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQL82Dialect
        default_schema: innodb
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    fetch-registry: false
    register-with-eureka: false
    service-url:
      defaultZone: http://${EUREKA_USER:manager}:${EUREKA_PASSWORD}@localhost:5003/eureka/
  server:
    expected-client-renewal-interval-seconds: 10
    enable-self-preservation: false
    renewal-percent-threshold: 0.33
    wait-time-in-ms-when-sync-empty: 0
    peer-node-read-timeout-ms: 30000

server:
  port: 5003
