name: CD - Build & Deploy Web React SIRA Guinée

# =============================================================================
# Une seule image pour TEST et PROD. Le client API utilise des chemins relatifs
# et nginx les relaie au gateway du réseau Docker interne : aucune URL n'est
# figée à la compilation.
#
# Le service déployé est `web`, seul frontend depuis le retrait de l'Angular
# le 2026-10-31.
# =============================================================================

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        type: choice
        options:
          - test
          - prod
        default: test
  push:
    branches:
      - main
    paths:
      - sira-frontend/**
      - .github/workflows/frontend-react-cd.yml

env:
  IMAGE: doukoure93/sira-web

jobs:
  # ============================================================================
  # JOB 1 — Vérifications puis build et publication de l'image
  # ============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.build-number.outputs.BUILD_NUMBER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sira-frontend/package-lock.json

      # Le typage strict est la seule barrière automatique avant la mise en
      # ligne tant que les tests de parité ne sont pas écrits.
      - name: Installer et vérifier le typage
        working-directory: sira-frontend
        run: |
          npm ci --ignore-scripts
          npx tsc -b packages/core packages/api-client packages/auth
          npm run typecheck --workspace @sira/web

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Generate build tag
        id: build-number
        run: echo "BUILD_NUMBER=$(date '+%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # test-latest et prod-latest pointent sur le même condensat : l'image ne
      # dépend pas de l'environnement, seul le tag déployé change.
      - name: Build & push image
        working-directory: sira-frontend
        run: |
          TAG=${{ steps.build-number.outputs.BUILD_NUMBER }}
          docker build \
            -t $IMAGE:$TAG \
            -t $IMAGE:test-latest \
            -t $IMAGE:prod-latest \
            --file Dockerfile \
            .
          docker push $IMAGE:$TAG
          docker push $IMAGE:test-latest
          docker push $IMAGE:prod-latest

      - name: Notify Slack — image publiée
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":whale: *SIRA Guinée* — image web React publiée\\n:label: Tag: \`${{ steps.build-number.outputs.BUILD_NUMBER }}\`\\n:link: <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

  # ============================================================================
  # JOB 2 — Déploiement TEST
  # ============================================================================
  deploy-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'test')
    environment: test

    steps:
      - name: Pull & restart web on TEST stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ~/sira-guinee/test

            sudo docker pull doukoure93/sira-web:test-latest
            sudo docker compose -p sira-test --env-file .env up -d --force-recreate --no-deps web

            sleep 8

            if ! sudo docker compose -p sira-test --env-file .env ps --status running --services | grep -qx web; then
              echo "Web React TEST KO"
              sudo docker compose -p sira-test --env-file .env logs --tail=30 web
              exit 1
            fi

            # Contrôle applicatif : l'index doit être servi, pas seulement le
            # conteneur démarré.
            PORT=$(grep -E '^WEB_HOST_PORT=' .env | cut -d= -f2)
            curl -fsS "http://127.0.0.1:${PORT:-4203}/health" > /dev/null

            echo "Web React TEST déployé"

      - name: Notify Slack — TEST succès
        if: success()
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":white_check_mark: *SIRA Guinée TEST* — web React déployé\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

      - name: Notify Slack — TEST échec
        if: failure()
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: *SIRA Guinée TEST* — déploiement web React EN ÉCHEC\\n:link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

  # ============================================================================
  # JOB 3 — Déploiement PROD (déclenchement manuel uniquement)
  # ============================================================================
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    environment: prod

    steps:
      - name: Pull & restart web on PROD stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ~/sira-guinee/prod

            sudo docker pull doukoure93/sira-web:prod-latest
            sudo docker compose -p sira-prod --env-file .env up -d --force-recreate --no-deps web

            sleep 8

            if ! sudo docker compose -p sira-prod --env-file .env ps --status running --services | grep -qx web; then
              echo "Web React PROD KO"
              sudo docker compose -p sira-prod --env-file .env logs --tail=30 web
              exit 1
            fi

            PORT=$(grep -E '^WEB_HOST_PORT=' .env | cut -d= -f2)
            curl -fsS "http://127.0.0.1:${PORT:-4203}/health" > /dev/null

            echo "Web React PROD déployé"

      - name: Notify Slack — PROD succès
        if: success()
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":fire: *SIRA Guinée PROD* — web React déployé\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

      - name: Notify Slack — PROD échec
        if: failure()
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: *SIRA Guinée PROD* — déploiement web React EN ÉCHEC\\n:link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true
