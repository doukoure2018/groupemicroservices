# =============================================================================
# nginx du conteneur web React.
#
# Rôle : servir le bundle et relayer les appels API vers le gateway par le DNS
# interne du réseau Docker. Le navigateur ne parle donc qu'à une seule origine,
# ce qui supprime toute question de CORS et rend l'image identique en TEST et
# en PROD.
#
# Les cinq préfixes ci-dessous sont exactement ceux que le gateway route, sans
# réécriture : /authorization, /user, /billetterie, /notification, /immo.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le RCCM et les photos peuvent dépasser la valeur par défaut d'1 Mo.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    include /etc/nginx/conf.d/securite.inc;

    # --- Relais vers le gateway --------------------------------------------
    # `gateway` est résolu par le DNS Docker dans la pile courante (sira-test
    # ou sira-prod). $host propage le nom d'hôte d'origine sans le figer.
    location /authorization/ { include /etc/nginx/conf.d/gateway.inc; proxy_pass http://gateway:9000/authorization/; }
    location /user/          { include /etc/nginx/conf.d/gateway.inc; proxy_pass http://gateway:9000/user/; }
    location /billetterie/   { include /etc/nginx/conf.d/gateway.inc; proxy_pass http://gateway:9000/billetterie/; }
    location /notification/  { include /etc/nginx/conf.d/gateway.inc; proxy_pass http://gateway:9000/notification/; }
    location /immo/          { include /etc/nginx/conf.d/gateway.inc; proxy_pass http://gateway:9000/immo/; }

    # --- Application monopage ----------------------------------------------
    # Les fichiers versionnés par empreinte sont immuables ; l'index ne doit
    # jamais être mis en cache, sinon un déploiement ne se voit pas.
    location /assets/ {
        include /etc/nginx/conf.d/securite.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/conf.d/securite.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
